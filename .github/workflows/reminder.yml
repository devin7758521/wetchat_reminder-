name: 全市场选股机器人
on:
  schedule:
    # 交易日盘中多时段运行（北京时间9:30、11:30、14:00）
    - cron: '30 1,3,6 * * 1-5'
  # 手动触发按钮
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - uses: actions/checkout@v4
      
      # 配置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 安装依赖包（AKShare、pandas等）
      - name: Install dependencies
        run: |
          pip install akshare pandas numpy requests
      
      # 运行你的代码文件（关键：改成send_msg.py）
      - name: Run stock bot
        run: python send_msg.py
