name: 选股机器人
on:
  schedule:
    - cron: '30 1,3,6 * * 1-5'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 直接安装所有依赖，强制包含tushare，不依赖requirements.txt
          pip install requests pandas tushare --no-cache-dir

      - name: Run stock bot
        run: python send_msg.py
