name: Stock Selection Bot

on:
  schedule:
    # 北京时间 = UTC + 8
    # 1. 周一至周五 09:00 -> UTC 01:00
    - cron: '0 1 * * 1-5'
    # 2. 周一至周五 12:00 -> UTC 04:00
    - cron: '0 4 * * 1-5'
    # 3. 周一至周五 15:35 -> UTC 07:35
    - cron: '35 7 * * 1-5'
  workflow_dispatch: 

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests akshare --upgrade --no-cache-dir

      - name: Run Stock Bot
        run: python send_msg.py
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
