import requests

def main():
    # 1. 微信机器人地址（替换成你的KEY）
    webhook = "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=da748662-f3d1-4edd-8031-2ee05c428605"
    
    # 2. 固定消息（先测试能不能收到，能收到再加选股逻辑）
    msg = "测试：微信推送成功！"
    
    # 3. 发送微信（极简写法，0报错）
    try:
        requests.post(
            webhook,
            json={"msgtype":"text","text":{"content":msg}},
            timeout=10
        )
        print("✅ 微信发送成功")
    except:
        print("❌ 微信发送失败")

if __name__ == "__main__":
    main()
