name: 选股机器人

on:
  schedule:
    # 北京时间 15:35 运行 (UTC 07:35)
    - cron: '35 7 * * 1-5'
  workflow_dispatch: # 👈 必须保留这个，方便你现在手动点一下测试

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 全量扫描主板需要时间，给足 1 小时上限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 必须安装这三个核心库
          pip install pandas requests akshare --upgrade --no-cache-dir

      - name: Run Stock Bot
        # 即使这里传了变量，如果你没在 GitHub 设置 Secret，
        # 脚本也会自动使用你 Python 代码里硬编码的那个 Key。
        run: python send_msg.py
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
