name: Stock and ETF Multi-Bot

on:
  schedule:
    - cron: '35 3 * * 1-5'   # 11:35
    - cron: '0 4 * * 1-5'    # 12:00
    - cron: '30 7 * * 1-5'   # 15:30
    - cron: '55 7 * * 1-5'   # 15:55
  workflow_dispatch:

jobs:
  # 个股任务
  stock_job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2]
    if: |
      (matrix.part == 1 && (github.event.schedule == '35 3 * * 1-5' || github.event.schedule == '30 7 * * 1-5')) ||
      (matrix.part == 2 && (github.event.schedule == '0 4 * * 1-5' || github.event.schedule == '55 7 * * 1-5')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: pip install pandas requests akshare lxml
      - name: Run Stock Bot
        run: python -u send_msg.py ${{ matrix.part }}

  # ETF 任务
  etf_job:
    if: github.event.schedule == '35 3 * * 1-5' || github.event.schedule == '30 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install deps
        run: pip install pandas requests akshare lxml
      - name: Run ETF Bot
        run: python -u etf_bot.py
