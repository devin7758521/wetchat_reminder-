name: 选股机器人
on:
  schedule:
    - cron: '30 1,3,6 * * 1-5'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 极速安装！只用最小组件，10秒内完成
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas -i https://pypi.tuna.tsinghua.edu.cn/simple --no-cache-dir

      # 运行你原来的 send_msg.py（我已经帮你修好报错了）
      - name: Run stock bot
        run: python send_msg.py
