name: 选股机器人
on:
  schedule:
    - cron: '30 1,3,6 * * 1-5'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # 缓存依赖，提升运行速度

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas urllib3 --no-cache-dir  # 新增urllib3，适配重试

      - name: Run stock bot
        run: python send_msg.py
