name: 选股机器人
on:
  schedule:
    - cron: '30 1 * * 1-5'   # 09:30
    - cron: '30 3 * * 1-5'   # 11:30
    - cron: '0 4 * * 1-5'    # 12:00
    - cron: '30 6 * * 1-5'   # 14:30
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas akshare --no-cache-dir

      - name: Run stock bot
        run: python send_msg.py
