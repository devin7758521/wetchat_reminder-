name: Stock Selection Bot

on:
  schedule:
    # 对应北京时间 09:00, 12:00, 15:35
    - cron: '0 1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '35 7 * * 1-5'
  workflow_dispatch:  # 允许在 GitHub 界面手动运行

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests akshare --upgrade --no-cache-dir

      - name: Run Stock Bot
        # 直接运行脚本，不再需要引用 Secret
        run: python -u send_msg.py
