name: 选股机器人
on:
  schedule:
    # 交易日 9:30、11:30、14:00（北京时间）
    - cron: '30 1,3,6 * * 1-5'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 重点：加国内源 + 只装稳定包，不装akshare！！
      - name: Install dependencies
        run: |
          pip install pandas requests lxml -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 重点：跑 main.py 不跑 send_msg.py
      - name: Run stock bot
        run: python main.py

      # 保存结果到仓库
      - name: Commit and push
        run: |
          git config --global user.name bot
          git config --global user.email bot@github.com
          git add .
          git commit -m "update stock data"
          git push
