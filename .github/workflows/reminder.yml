name: Stock Multi-Bot v15.Final

on:
  schedule:
    - cron: '35 3 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  stock_part1:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '35 3') || contains(github.event.schedule, '30 7')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install pandas requests akshare lxml google-generativeai
      - name: Run Part 1
        env:
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: python -u send_msg.py 1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hits-p1
          path: hits_part1.json
          retention-days: 1

  stock_part2:
    runs-on: ubuntu-latest
    needs: stock_part1
    if: always() # 确保 Part 1 跑完后无论如何都尝试运行
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install pandas requests akshare lxml google-generativeai
      - name: Download P1 Data
        uses: actions/download-artifact@v4
        with:
          name: hits-p1
          path: hits-p1
      - name: Run Part 2 & AI Summary
        env:
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u send_msg.py 2
          python -u send_msg.py summary
