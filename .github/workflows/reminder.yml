name: Plank Reminder

on:
  schedule:
    # 每天中国时间 20:00 发送（UTC 12:00）
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Send WeChat message
        run: python send_msg.py
